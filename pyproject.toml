[project]
name = "rocia-db-sdk"
version = "0.6.0"
description = "Python client SDK for RociaDB document, graph, file, and tenant gRPC services"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.15"
keywords = ["rociadb", "database", "grpc", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "grpcio>=1.60",
    "protobuf>=4.25",
]

[project.urls]
Homepage = "https://github.com/RociaDB/rociadb-core-sdk-python"
Repository = "https://github.com/RociaDB/rociadb-core-sdk-python"

[dependency-groups]
dev = [
    "grpcio-tools>=1.60",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rocia_db_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src/rocia_db_sdk", "proto", "tests", "scripts", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Optional/Union/List stay spelled out (not X | Y / list[X]) so every public
# signature matches across the 3.10-3.14 support range without relying on
# PEP 604/585 nuances; see CONTRAINTES PYTHON.
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
# Generated by protoc; not ours to lint.
"src/rocia_db_sdk/_pb/**" = ["ALL"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/rocia_db_sdk", "tests"]
mypy_path = ["src", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# protoc emits untyped modules alongside the .pyi stubs it also emits.
module = ["rocia_db_sdk._pb.*", "grpc.*"]
ignore_errors = true
ignore_missing_imports = true
follow_imports = "skip"
